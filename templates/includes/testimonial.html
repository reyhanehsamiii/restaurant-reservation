<div class="container-xxl py-5 wow fadeInUp" data-wow-delay="0.1s">
    <div class="container">
        <div class="text-center">
            <h5 class="section-title ff-secondary text-center text-primary fw-normal">Testimonial</h5>
            <h1 class="mb-5">Our Clients Say!!!</h1>
        </div>
        <div class="owl-carousel testimonial-carousel">
            {% for item in testimonials %}
            <div class="testimonial-item bg-transparent border rounded p-4">
                <i class="fa fa-quote-left fa-2x text-primary mb-3"></i>
                <p>{{ item.message|safe }}</p>
                <div class="d-flex align-items-center">
                    <img class="img-fluid flex-shrink-0 rounded-circle" src="{{ item.image.url }}"
                         style="width: 50px; height: 50px;" alt="{{ item.client_name }}">
                    <div class="ps-3">
                        <h5 class="mb-1">{{ item.client_name }}</h5>
                        <small>{{ item.profession }}</small>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="testimonial-item bg-transparent border rounded p-4">
                <p class="text-center text-muted mb-0">هنوز نظری ثبت نشده است.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
