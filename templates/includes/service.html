<div class="container-xxl py-5">
    <div class="container">
        <div class="row g-4">
            {% for service in services %}
            <div class="col-lg-3 col-sm-6 wow fadeInUp" data-wow-delay="0.{{ forloop.counter }}s">
                <div class="service-item rounded pt-3">
                    <div class="p-4">
                        <i class="fa fa-3x {{ service.icon }} text-primary mb-4"></i>
                        <h5>{{ service.title }}</h5>
                        <p>{{ service.description }}</p>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center text-muted py-4">هنوز خدمتی ثبت نشده است.</div>
            {% endfor %}
        </div>
    </div>
</div>
